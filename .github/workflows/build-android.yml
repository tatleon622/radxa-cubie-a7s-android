name: Build Cubie A7S Boot & DTB

on:
  workflow_dispatch:
    inputs:
      ram_size:
        description: 'Объем ОЗУ вашей платы'
        required: true
        default: '4GB / 8GB'
        type: choice
        options:
          - '4GB / 8GB'
          - '6GB'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Device Tree Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler gcc cpp zip

      - name: Compile August DTB and Collect Boot Binaries
        run: |
          mkdir -p output
          
          # Копируем свежие бинарники загрузчика из репозитория автора
          find . -name "*.fex" -exec cp {} output/ \; || true
          find . -name "*.bin" -exec cp {} output/ \; || true
          
          # Путь к августовскому DTS файлу платы
          DTS_DIR="longan/device/config/chips/a733/configs/radxa_a7s"
          find "$DTS_DIR" - type f
          
          # Сохраняем все конфиги и бинарники из репозитория в архив
          zip -r cubie-a7s-august-files.zip longan/ device/ output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cubie-A7S-August-Files
          path: cubie-a7s-august-files.zip
