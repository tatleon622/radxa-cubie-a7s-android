
#kernel command arguments
earlycon=uart8250,mmio32,0x02500000
initcall_debug=0
console=ttyAS0,115200
#console1=tty0
nand_root=/dev/nand0p4
mmc_root=/dev/mmcblk0p4
ufs_root=/dev/sda4
init=/init
init_rc=
loglevel=8
cma=8M
slub_min_objects=8
mac=
wifi_mac=
bt_mac=
specialstr=
rcu_idle_gp_delay=1
default_governor=performance
force_normal_boot=1
slot_suffix=_a
keybox_list=widevine,ec_key,ec_cert1,ec_cert2,ec_cert3,rsa_key,rsa_cert1,rsa_cert2,rsa_cert3,hdcpkey
ab_partition_list=bootloader,env,boot,vendor_boot,dtbo,vbmeta,vbmeta_system,vbmeta_vendor,init_boot
trace_buf_size=64M
trace_event=sched_wakeup,sched_switch,sched_blocked_reason,sched_cpu_hotplug,block,ext4
trace_enable=0
#set kernel cmdline if boot.img or recovery.img has no cmdline we will use this
setargs_nand=setenv bootargs rcutree.rcu_idle_gp_delay=${rcu_idle_gp_delay} cpufreq.default_governor=${default_governor} earlycon=${earlycon} clk_ignore_unused initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${nand_root} init=${init} init_rc=${init_rc} cma=${cma} slub_min_objects=${slub_min_objects} snum=${snum} mac_addr=${mac} wifi_mac=${wifi_mac} bt_mac=${bt_mac} specialstr=${specialstr} gpt=1 androidboot.force_normal_boot=${force_normal_boot} androidboot.slot_suffix=${slot_suffix} sn2=${sn2} androidboot.sn2=${sn2} deferred_probe_timeout=10 nokaslr
setargs_mmc=setenv  bootargs rcutree.rcu_idle_gp_delay=${rcu_idle_gp_delay} cpufreq.default_governor=${default_governor} earlycon=${earlycon} clk_ignore_unused initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${mmc_root}  init=${init} init_rc=${init_rc} cma=${cma} slub_min_objects=${slub_min_objects} snum=${snum} mac_addr=${mac} wifi_mac=${wifi_mac} bt_mac=${bt_mac} specialstr=${specialstr} gpt=1 androidboot.force_normal_boot=${force_normal_boot} androidboot.slot_suffix=${slot_suffix} sn2=${sn2} androidboot.sn2=${sn2} deferred_probe_timeout=10 nokaslr
setargs_ufs=setenv  bootargs rcutree.rcu_idle_gp_delay=${rcu_idle_gp_delay} cpufreq.default_governor=${default_governor} earlycon=${earlycon} clk_ignore_unused initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${ufs_root}  init=${init} init_rc=${init_rc} cma=${cma} slub_min_objects=${slub_min_objects} snum=${snum} mac_addr=${mac} wifi_mac=${wifi_mac} bt_mac=${bt_mac} specialstr=${specialstr} gpt=1 androidboot.force_normal_boot=${force_normal_boot} androidboot.slot_suffix=${slot_suffix} sn2=${sn2} androidboot.sn2=${sn2} deferred_probe_timeout=10 nokaslr
#nand command syntax: sunxi_flash read address partition_name read_bytes
#0x401ff000 = 0x40200000(kernel entry) - 0x1000(boot.img header 4k)
#BOARD_KERNEL_OFFSET=0x200000 aligns the kernel to a 2MB boundary required by arm64 paging_init.
boot_normal=sunxi_flash read 401FF000 boot;bootm 401FF000
boot_recovery=sunxi_flash read 401FF000 recovery;bootm 401FF000
boot_fastboot=fastboot

#uboot system env config
bootdelay=0
#default bootcmd, will change at runtime according to key press
bootcmd=run setargs_nand boot_normal#default nand boot
